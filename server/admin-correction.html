<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>角色卡审计与修正 - AI 酒馆管理界面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    .header h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .stat-card h3 {
      color: #667eea;
      font-size: 36px;
      margin-bottom: 5px;
    }

    .stat-card p {
      color: #666;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      flex: 1;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
    }

    .btn-secondary:hover {
      background: #f8f9ff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress-section {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: none;
    }

    .progress-section.active {
      display: block;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      color: #666;
      font-size: 14px;
    }

    .report-section {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: none;
    }

    .report-section.active {
      display: block;
    }

    .report-section h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 15px;
    }

    .error-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    .error-table th,
    .error-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }

    .error-table th {
      background: #f8f9ff;
      color: #667eea;
      font-weight: 600;
    }

    .error-table tr:hover {
      background: #f8f9ff;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-warning {
      background: #fff3cd;
      color: #856404;
    }

    .badge-danger {
      background: #f8d7da;
      color: #721c24;
    }

    .badge-info {
      background: #d1ecf1;
      color: #0c5460;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      margin-left: 10px;
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: white;
      border-radius: 8px;
      padding: 15px 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      display: none;
      z-index: 1000;
    }

    .toast.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    .toast.success {
      border-left: 4px solid #28a745;
    }

    .toast.error {
      border-left: 4px solid #dc3545;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎭 角色卡审计与修正</h1>
      <p>基于小说原文自动审计和修正角色卡与世界书条目</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3 id="characterCount">-</h3>
        <p>角色卡数量</p>
      </div>
      <div class="stat-card">
        <h3 id="worldbookCount">-</h3>
        <p>世界书条目</p>
      </div>
      <div class="stat-card">
        <h3 id="errorCount">-</h3>
        <p>发现错误</p>
      </div>
      <div class="stat-card">
        <h3 id="lastUpdateTime">-</h3>
        <p>最后修正时间</p>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="startFullAudit()">
        🚀 开始全域审计与修正
      </button>
      <button class="btn btn-secondary" onclick="startAuditOnly()">
        📋 仅生成差异报告（不修正）
      </button>
    </div>

    <div class="progress-section" id="progressSection">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-text" id="progressText">审计中...</p>
    </div>

    <div class="report-section" id="reportSection">
      <h2>📊 差异报告</h2>
      
      <h3>角色卡错误</h3>
      <table class="error-table">
        <thead>
          <tr>
            <th>角色名</th>
            <th>文件</th>
            <th>错误类型</th>
            <th>当前值</th>
            <th>正确值</th>
            <th>置信度</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="characterErrors">
        </tbody>
      </table>

      <h3>世界书警告</h3>
      <table class="error-table">
        <thead>
          <tr>
            <th>条目ID</th>
            <th>文件</th>
            <th>警告信息</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="worldbookErrors">
        </tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // 加载统计数据
    async function loadStats() {
      try {
        const response = await fetch('/api/characters/versions');
        const data = await response.json();
        
        if (data.success) {
          const versions = data.versions;
          let characterCount = 0;
          let worldbookCount = 0;
          
          for (const key in versions) {
            if (key.startsWith('角色卡_')) {
              characterCount++;
            } else if (key.startsWith('蛊真人世界书_')) {
              worldbookCount++;
            }
          }
          
          document.getElementById('characterCount').textContent = characterCount;
          document.getElementById('worldbookCount').textContent = worldbookCount;
          document.getElementById('errorCount').textContent = '0';
          document.getElementById('lastUpdateTime').textContent = '刚刚';
        }
      } catch (error) {
        console.error('加载统计失败:', error);
      }
    }

    // 开始全域审计与修正
    async function startFullAudit() {
      showProgress('正在审计角色卡...');
      
      try {
        // 调用审计 API
        const response = await fetch('/api/characters/audit-only', {
          method: 'POST'
        });
        const data = await response.json();
        
        if (data.success) {
          showProgress('正在修正错误...');
          displayReport(data.report);
          
          // 触发热更新
          await fetch('/api/characters/correct-from-novel', {
            method: 'POST'
          });
          
          hideProgress();
          showToast('审计与修正完成！', 'success');
        } else {
          hideProgress();
          showToast('审计失败', 'error');
        }
      } catch (error) {
        console.error('审计失败:', error);
        hideProgress();
        showToast('审计失败: ' + error.message, 'error');
      }
    }

    // 仅生成差异报告
    async function startAuditOnly() {
      showProgress('正在生成差异报告...');
      
      try {
        const response = await fetch('/api/characters/audit-only', {
          method: 'POST'
        });
        const data = await response.json();
        
        if (data.success) {
          hideProgress();
          displayReport(data.report);
          showToast('差异报告已生成', 'success');
        } else {
          hideProgress();
          showToast('生成报告失败', 'error');
        }
      } catch (error) {
        console.error('生成报告失败:', error);
        hideProgress();
        showToast('生成报告失败: ' + error.message, 'error');
      }
    }

    // 显示报告
    function displayReport(report) {
      const characterErrors = document.getElementById('characterErrors');
      const worldbookErrors = document.getElementById('worldbookErrors');
      
      characterErrors.innerHTML = '';
      worldbookErrors.innerHTML = '';
      
      // 角色卡错误
      if (report.character_errors && report.character_errors.length > 0) {
        report.character_errors.forEach(error => {
          error.errors.forEach(err => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${error.name || '-'}</td>
              <td>${error.file}</td>
              <td><span class="badge badge-danger">${err.type}</span></td>
              <td>${err.currentValue.substring(0, 50)}...</td>
              <td>${err.correctValue}</td>
              <td>${(err.confidence * 100).toFixed(0)}%</td>
              <td>
                <button class="btn btn-sm btn-primary" onclick="fixSingleError('${error.file}', '${err.field}')">修正</button>
              </td>
            `;
            characterErrors.appendChild(row);
          });
        });
        
        document.getElementById('errorCount').textContent = report.summary.character_errors;
      } else {
        characterErrors.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;">未发现角色卡错误</td></tr>';
      }
      
      // 世界书警告
      if (report.worldbook_errors && report.worldbook_errors.length > 0) {
        report.worldbook_errors.forEach(error => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${error.id}</td>
            <td>${error.file}</td>
            <td><span class="badge badge-warning">${error.warning}</span></td>
            <td>
              <button class="btn btn-sm btn-secondary" onclick="showWorldbookDetail('${error.id}')">查看</button>
            </td>
          `;
          worldbookErrors.appendChild(row);
        });
      } else {
        worldbookErrors.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#999;">未发现世界书警告</td></tr>';
      }
      
      document.getElementById('reportSection').classList.add('active');
    }

    // 修正单个错误
    async function fixSingleError(file, field) {
      try {
        showToast('正在修正...', 'success');
        // 这里需要实现单个修正的 API 调用
        // 暂时使用热更新
        await fetch('/api/characters/correct-from-novel', {
          method: 'POST'
        });
        showToast('修正完成', 'success');
      } catch (error) {
        showToast('修正失败', 'error');
      }
    }

    // 显示世界书详情
    function showWorldbookDetail(id) {
      alert('查看世界书详情: ' + id);
    }

    // 显示进度
    function showProgress(text) {
      document.getElementById('progressSection').classList.add('active');
      document.getElementById('progressText').textContent = text;
      document.getElementById('progressFill').style.width = '50%';
    }

    // 隐藏进度
    function hideProgress() {
      document.getElementById('progressSection').classList.remove('active');
      document.getElementById('progressFill').style.width = '100%';
    }

    // 显示提示
    function showToast(message, type) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast ' + type + ' show';
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // 页面加载时加载统计
    window.onload = loadStats;
  </script>
</body>
</html>
